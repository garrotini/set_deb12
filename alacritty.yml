# Alacritty config for Debian 12.
# NOTE: this file MUST stay YAML. Debian 12 ships alacritty 0.11.0, which only
# parses YAML. TOML requires alacritty >= 0.13 (see `alacritty migrate`).
colors:
  normal:
    black: "#15161e"
    red: "#f7768e"
    green: "#9ece6a"
    yellow: "#e0af68"
    blue: "#7aa2f7"
    magenta: "#bb9af7"
    cyan: "#7dcfff"
    white: "#a9b1d6"

  bright:
    black: "#414868"
    red: "#ff899d"
    green: "#9fe044"
    yellow: "#faba4a"
    blue: "#8db0ff"
    magenta: "#c7a9ff"
    cyan: "#a4daff"
    white: "#c0caf5"

  cursor:
    text: "#1a1b26"
    cursor: "#c0caf5"

  selection:
    text: "#c0caf5"
    background: "#283457"

  indexed_colors:
    - index: 16
      color: "#ff9e64"
    - index: 17
      color: "#db4b4b"

font:
  size: 12.0
  # Family name has a space; "SGr-IosevkaTerm" is only the filename.
  # Bold/Italic/Bold-Italic come from the same .ttc and need no entries.
  normal:
    family: Iosevka Term
    style: Regular

window:
  decorations: "none"
  opacity: 1.00
  padding:
    x: 15
    y: 10

env:
  TERM: "xterm-256color"